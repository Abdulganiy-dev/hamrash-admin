# App icon config. Regenerate with: fvm dart run flutter_launcher_icons
# Source artwork lives in branding/app_icon/ (not bundled into the app).
flutter_launcher_icons:
  image_path: "branding/app_icon/icon_light.png"

  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "branding/app_icon/icon_dark.png"
  image_path_ios_tinted_grayscale: "branding/app_icon/icon_tinted.png"

  # Android has no dark launcher icon, so it always uses the light artwork.
  # The tool insets the adaptive foreground 16% per side, so the full square fits the visible area.
  # After regenerating, revert the tool's change to ios/Runner.xcodeproj/project.pbxproj
  # (it wrongly sets ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS).
  android: true
  adaptive_icon_background: "#0866E8"
  adaptive_icon_foreground: "branding/app_icon/icon_light.png"
  min_sdk_android: 21

  web:
    generate: true
    image_path: "branding/app_icon/icon_light.png"
    background_color: "#0866E8"
    theme_color: "#0866E8"

  macos:
    generate: true
    image_path: "branding/app_icon/icon_macos.png"
